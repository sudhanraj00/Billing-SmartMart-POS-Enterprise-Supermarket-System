services:
  postgres:
    image: postgres:16-alpine
    container_name: smartmart-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-smartmart_pos}
    ports:
      - "5432:5432"
    volumes:
      - smartmart_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d smartmart_pos"]
      interval: 5s
      timeout: 5s
      retries: 5

  server:
    build:
      context: ./server
      dockerfile: Dockerfile
    container_name: smartmart-server
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: 5000
      DATABASE_URL: postgresql://postgres:postgres@postgres:5432/smartmart_pos?schema=public
      JWT_SECRET: ${JWT_SECRET:-super-secret-smartmart-key-change-in-production-32chars}
      JWT_EXPIRES_IN: 8h
      CLIENT_URL: http://localhost:3000
      COOKIE_SECURE: "false"
    ports:
      - "5000:5000"
    depends_on:
      postgres:
        condition: service_healthy

  client:
    build:
      context: ./client
      dockerfile: Dockerfile
    container_name: smartmart-client
    restart: unless-stopped
    ports:
      - "3000:80"
    depends_on:
      - server

volumes:
  smartmart_pgdata:
